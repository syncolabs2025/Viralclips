version: "3.9"

services:

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./backend:/app
      - local_storage:/tmp/viralclips

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    command: python worker.py
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./worker:/app
      - local_storage:/tmp/viralclips
    deploy:
      resources:
        limits:
          memory: 8G
    # To add more workers: docker compose up --scale worker=4

volumes:
  local_storage:
