version: "3.9"

services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: viralclips
      POSTGRES_PASSWORD: viralclips
      POSTGRES_DB: viralclips
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://viralclips:viralclips@postgres:5432/viralclips
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
      - local_storage:/tmp/viralclips
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    command: python worker.py
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://viralclips:viralclips@postgres:5432/viralclips
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./worker:/app
      - local_storage:/tmp/viralclips
    depends_on:
      - postgres
      - redis
    deploy:
      resources:
        limits:
          memory: 8G
    # To add more workers: docker compose up --scale worker=4

volumes:
  postgres_data:
  redis_data:
  local_storage:
